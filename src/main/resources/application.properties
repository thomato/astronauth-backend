spring.application.name=thynq-auth-backend
spring.threads.virtual.enabled=true

# GraphQL (GraphiQL is enabled by the dev profile only)
spring.graphql.graphiql.enabled=false
spring.graphql.http.path=/graphql
spring.graphql.schema.locations=classpath:graphql/
# Where people reach Astronauth; used in links sent by email
astronauth.public-url=http://localhost:8080

# Client limits count per client address. Behind a reverse proxy, set server.forward-headers-strategy=native
# so the address comes from X-Forwarded-For, trusted only from the proxy's internal address.
astronauth.limits.registration.max=10
astronauth.limits.registration.window=10m
astronauth.limits.verification.max=20
astronauth.limits.verification.window=10m
astronauth.limits.emails-per-address.max=3
astronauth.limits.emails-per-address.window=1h

# Mail (Mailpit from compose.yaml locally; its web inbox runs on http://localhost:8025)
astronauth.mail.from=Astronauth <no-reply@localhost>
spring.mail.host=localhost
spring.mail.port=1025

# Let queued background work (such as Registration) finish on shutdown
spring.task.execution.shutdown.await-termination=true
spring.task.execution.shutdown.await-termination-period=10s
