default_install_hook_types: [pre-commit, commit-msg]
repos:
  # Kotlin linting and formatting
  - repo: local
    hooks:
      # KtLint formatting check
      - id: ktlint-check
        name: ktlint check
        entry: ./gradlew ktlintCheck
        language: system
        files: \.kt$
        pass_filenames: false

      # Detekt linting
      - id: detekt
        name: detekt
        entry: ./gradlew detekt
        language: system
        files: \.kt$
        pass_filenames: false

      # Run tests
      - id: gradle-test
        name: gradle test
        entry: ./gradlew test
        language: system
        files: \.(kt|kts|java|properties|yaml|yml)$
        pass_filenames: false

      # Frontend lint, formatting, types and component tests; the types come from the GraphQL schema
      - id: frontend-check
        name: frontend check
        entry: ./gradlew frontendLint frontendTest
        language: system
        files: ^(frontend/|src/main/resources/graphql/)
        pass_filenames: false
  # Commit message format
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, feat, fix, refactor, docs, style, test, chore, build, ci, perf]
