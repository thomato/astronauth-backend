name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '25'

jobs:
  lint:
    name: Lint (ktlint, detekt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v6

      - name: Run ktlint and detekt
        run: ./gradlew ktlintCheck detekt

      - name: Upload lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: |
            build/reports/ktlint/
            build/reports/detekt/
          retention-days: 7

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # the test reporter publishes results as a check run
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v6

      # Integration tests start their own Postgres through Testcontainers, using the runner's Docker
      - name: Run tests
        run: ./gradlew test

      - name: Publish test results
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3
        with:
          name: Test results
          path: build/test-results/test/*.xml
          reporter: java-junit

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests/test/
          retention-days: 7

  build:
    name: Build jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v6

      - name: Build executable jar
        run: ./gradlew bootJar

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: astronauth-jar
          path: build/libs/*.jar
          retention-days: 7
